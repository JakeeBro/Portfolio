<div class="wrapper" [class.featured]="projectCardData.featured" (click)="openProject()">
  <div class="content">
    @if (projectCardData.featured) {
      <h1>FEATURED</h1>
    }
    <img class="image" [src]="projectCardData.image" [alt]="projectCardData.title" [style.background-color]="projectCardData.specialColor || 'transparent'"/>
    <div class="info">
      <h3>{{ projectCardData.title }}</h3>
      <p>{{ projectCardData.desc }}</p>
    </div>
  </div>
</div>
