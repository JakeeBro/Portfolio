<section class="projects-section">
  <h1>My Projects</h1>
  <div class="projects-container">
    <div class="project-group">
      <h2>Featured</h2>
      <div class="project-list">
        @for (project of featured_projects; track project.id) {
          <app-project-card [projectCardData]="project"></app-project-card>
        }
      </div>
    </div>
    <div class="project-group">
      <h2>Web Development</h2>
      <div class="project-list">
        @for (project of web_projects; track project.id) {
          <app-project-card [projectCardData]="project"></app-project-card>
        }
      </div>
    </div>
    <div class="project-group">
      <h2>Game Development</h2>
      <div class="project-list">
        @for (project of game_projects; track project.id) {
          <app-project-card [projectCardData]="project"></app-project-card>
        }
      </div>
    </div>
  </div>
</section>
