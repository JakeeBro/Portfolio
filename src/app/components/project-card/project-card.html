<div class="card" (click)="openProject()">
  <div class="card-content">
    <div class="card-image-wrapper">
      <img class="card-image" [src]="image" [alt]="title">
    </div>
    <div class="card-label">
      <div class="card-info">
        <h3>{{ title }}</h3>
        <p>{{ desc }}</p>
      </div>
      <img class="card-icon" id="icon"[src]="icon" [alt]="icon">
    </div>
  </div>
</div>
